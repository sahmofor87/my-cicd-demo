name: Basic CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Run basic test
        run: |
          echo "Running CI pipeline..."
          cat app.txt
          echo "Pipeline completed successfully"
