```yaml
name: CI/CD DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read
  security-events: write

env:
  JFROG_REGISTRY: trialgctmla.jfrog.io
  IMAGE_NAME: docker-local/my-cicd-demo
  K8S_DEPLOYMENT: my-cicd-demo
  K8S_CONTAINER: my-cicd-demo

jobs:
  build-test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Run basic test
        run: |
          echo "Running CI pipeline..."
          cat app.txt
          echo "Pipeline completed successfully"

  codeql-analysis:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  docker-build-trivy-push:
    name: Build, Scan, and Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - build-test
      - codeql-analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to JFrog Artifactory
        run: |
          echo "${{ secrets.JFROG_TOKEN }}" | docker login $JFROG_REGISTRY \
            -u "${{ secrets.JFROG_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build -t $JFROG_REGISTRY/$IMAGE_NAME:${{ github.sha }} .
          docker tag $JFROG_REGISTRY/$IMAGE_NAME:${{ github.sha }} $JFROG_REGISTRY/$IMAGE_NAME:latest

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.JFROG_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Push Docker image to JFrog
        run: |
          docker push $JFROG_REGISTRY/$IMAGE_NAME:${{ github.sha }}
          docker push $JFROG_REGISTRY/$IMAGE_NAME:latest

  deploy-to-kubernetes:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: docker-build-trivy-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes cluster
        run: |
          kubectl get nodes

      - name: Create or update JFrog image pull secret
        run: |
          kubectl create secret docker-registry jfrog-regcred \
            --docker-server=$JFROG_REGISTRY \
            --docker-username="${{ secrets.JFROG_USERNAME }}" \
            --docker-password="${{ secrets.JFROG_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/

      - name: Update Kubernetes deployment image
        run: |
          kubectl set image deployment/$K8S_DEPLOYMENT \
            $K8S_CONTAINER=$JFROG_REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Verify Kubernetes rollout
        run: |
          kubectl rollout status deployment/$K8S_DEPLOYMENT

      - name: Show Kubernetes resources
        run: |
          kubectl get deployments
          kubectl get pods -o wide
          kubectl get svc
```

